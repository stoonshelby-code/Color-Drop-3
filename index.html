<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>COLOR DROP</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#000;display:flex;align-items:center;justify-content:center;min-height:100vh;overflow:hidden;touch-action:none;}
canvas{display:block;border-radius:20px;}
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const W=Math.min(window.innerWidth,360);
const H=Math.min(window.innerHeight,620);
canvas.width=W;canvas.height=H;
const SEG_W=W/4;

// ══════════════════════════════════
//  BG DATA
// ══════════════════════════════════
const bgData={
  space:Array.from({length:120},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()<0.1?2:1,bright:0.4+Math.random()*0.6,spd:0.5+Math.random()*1.5,phase:Math.random()*6.28})),
  ocean:Array.from({length:25},()=>({x:Math.random()*W,y:Math.random()*H,r:1+Math.random()*2,vy:0.2+Math.random()*0.5,phase:Math.random()*6.28})),
  volcano:Array.from({length:30},()=>({x:W*0.62+(Math.random()-0.5)*20,y:H*0.45+Math.random()*50,vy:1+Math.random()*3,vx:(Math.random()-0.5)*2,r:1+Math.random()*2,life:Math.random()})),
  smoke:Array.from({length:12},()=>({x:W*0.62+(Math.random()-0.5)*15,y:H*(0.2+Math.random()*0.25),r:5+Math.random()*15,alpha:Math.random()*0.15,phase:Math.random()*6.28})),
  forest:Array.from({length:20},()=>({x:Math.random()*W,y:H*0.2+Math.random()*H*0.6,phase:Math.random()*6.28})),
  electric:Array.from({length:6},()=>({x:W*0.2+Math.random()*W*0.6,y:H*0.2+Math.random()*H*0.6,r:30+Math.random()*50,spd:0.5+Math.random(),phase:Math.random()*6.28})),
  sparks:Array.from({length:25},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-0.5)*3,vy:(Math.random()-0.5)*3,life:Math.random()}))
};

// ══════════════════════════════════
//  BACKGROUNDS
// ══════════════════════════════════
function drawBG_Space(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#000005');g.addColorStop(0.5,'#05001A');g.addColorStop(1,'#0A0030');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const t=Date.now()/8000;
  [[W*0.2,H*0.2,80,'rgba(80,0,180,0.12)'],[W*0.8,H*0.4,100,'rgba(0,50,180,0.10)'],[W*0.5,H*0.7,120,'rgba(180,0,80,0.08)']].forEach(([x,y,r,c])=>{const rg=ctx.createRadialGradient(x+Math.sin(t)*10,y+Math.cos(t)*8,0,x,y,r);rg.addColorStop(0,c);rg.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=rg;ctx.fillRect(0,0,W,H);});
  bgData.space.forEach(s=>{const tw=0.4+0.6*Math.sin(Date.now()/1000*s.spd+s.phase);ctx.globalAlpha=tw*s.bright;ctx.fillStyle='#fff';ctx.fillRect(s.x,s.y,s.r,s.r);});ctx.globalAlpha=1;
}
function drawBG_Ocean(){
  const t=Date.now()/3000;const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#000818');g.addColorStop(0.4,'#001830');g.addColorStop(1,'#002040');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  for(let i=0;i<5;i++){const x=W*(0.1+i*0.2)+Math.sin(t+i)*20;const ray=ctx.createLinearGradient(x,0,x+30,H*0.7);ray.addColorStop(0,'rgba(0,180,255,0.08)');ray.addColorStop(1,'rgba(0,180,255,0)');ctx.save();ctx.transform(1,0,0.3,1,0,0);ctx.fillStyle=ray;ctx.fillRect(x,0,18,H*0.7);ctx.restore();}
  for(let w=0;w<4;w++){ctx.save();ctx.strokeStyle=`rgba(0,200,255,${0.04+w*0.02})`;ctx.lineWidth=1+w*0.5;ctx.beginPath();for(let x=0;x<=W;x+=3){const y=H*(0.15+w*0.06)+Math.sin(x/40+t*(1+w*0.3))*8+Math.sin(x/20-t)*4;x===0?ctx.moveTo(x,y):ctx.lineTo(x,y);}ctx.stroke();ctx.restore();}
  bgData.ocean.forEach(b=>{b.y-=b.vy;b.x+=Math.sin(Date.now()/1000+b.phase)*0.3;if(b.y<-10)b.y=H+5;const pulse=0.3+0.7*Math.sin(Date.now()/800+b.phase);ctx.save();ctx.globalAlpha=pulse*0.6;ctx.shadowColor='#00FFFF';ctx.shadowBlur=6;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fillStyle=`hsl(${180+b.phase*20},100%,70%)`;ctx.fill();ctx.restore();});
}
function drawBG_Volcano(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0A0000');g.addColorStop(0.4,'#1A0500');g.addColorStop(0.7,'#2A0800');g.addColorStop(1,'#3D0A00');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.save();ctx.fillStyle='#0D0200';ctx.beginPath();ctx.moveTo(0,H);ctx.lineTo(W*0.1,H*0.7);ctx.lineTo(W*0.25,H*0.85);ctx.lineTo(W*0.38,H*0.5);ctx.lineTo(W*0.5,H*0.55);ctx.lineTo(W*0.62,H*0.45);ctx.lineTo(W*0.75,H*0.6);ctx.lineTo(W*0.88,H*0.72);ctx.lineTo(W,H*0.65);ctx.lineTo(W,H);ctx.closePath();ctx.fill();ctx.restore();
  const lg=ctx.createRadialGradient(W*0.62,H*0.45,0,W*0.62,H*0.45,80);lg.addColorStop(0,'rgba(255,100,0,0.3)');lg.addColorStop(1,'rgba(255,50,0,0)');ctx.fillStyle=lg;ctx.fillRect(0,0,W,H);
  bgData.volcano.forEach(e=>{e.y-=e.vy;e.x+=e.vx;e.life-=0.003;if(e.life<=0||e.y<0){e.x=W*0.62+(Math.random()-0.5)*20;e.y=H*0.45;e.life=0.8+Math.random()*0.2;e.vy=1+Math.random()*3;e.vx=(Math.random()-0.5)*2;}ctx.save();ctx.globalAlpha=e.life*0.8;ctx.shadowColor='#FF4400';ctx.shadowBlur=4;ctx.fillStyle=`hsl(${20+e.life*20},100%,${50+e.life*20}%)`;ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,Math.PI*2);ctx.fill();ctx.restore();});
  bgData.smoke.forEach(s=>{s.y-=0.4;s.x+=Math.sin(Date.now()/2000+s.phase)*0.5;s.r+=0.05;s.alpha-=0.001;if(s.alpha<=0||s.y<H*0.1){s.x=W*0.62+(Math.random()-0.5)*15;s.y=H*0.42;s.r=5;s.alpha=0.15;s.phase=Math.random()*6.28;}ctx.save();ctx.globalAlpha=s.alpha;ctx.fillStyle='#333';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();ctx.restore();});
}
function drawBG_Forest(){
  const t=Date.now()/4000;const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#020D02');g.addColorStop(0.3,'#041A04');g.addColorStop(1,'#021002');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  for(let i=0;i<6;i++){const x=W*(i/6)+Math.sin(t+i*1.2)*15;const beam=ctx.createLinearGradient(x,0,x+20,H*0.65);beam.addColorStop(0,`rgba(180,255,100,${0.04+Math.sin(t+i)*0.02})`);beam.addColorStop(1,'rgba(180,255,100,0)');ctx.save();ctx.transform(1,0,0.2,1,0,0);ctx.fillStyle=beam;ctx.fillRect(x-10,0,16,H*0.65);ctx.restore();}
  ctx.fillStyle='#020A02';for(let i=0;i<8;i++){const tx=i*(W/7)-10,th=H*(0.3+Math.sin(i*2.3)*0.1);ctx.beginPath();ctx.moveTo(tx,H);ctx.lineTo(tx+12,H-th*0.4);ctx.lineTo(tx+6,H-th);ctx.lineTo(tx,H-th*0.4);ctx.fill();ctx.beginPath();ctx.arc(tx+6,H-th,18+i*2,0,Math.PI*2);ctx.fill();}
  ctx.fillStyle='#010601';for(let i=0;i<5;i++){const tx=i*(W/4)-5,th=H*0.55;ctx.beginPath();ctx.moveTo(tx,H);ctx.lineTo(tx+8,H-th*0.3);ctx.lineTo(tx+4,H-th);ctx.lineTo(tx,H-th*0.3);ctx.fill();ctx.beginPath();ctx.arc(tx+4,H-th,22,0,Math.PI*2);ctx.fill();}
  bgData.forest.forEach(f=>{f.x+=Math.sin(Date.now()/1200+f.phase)*0.6;f.y+=Math.cos(Date.now()/1000+f.phase*1.3)*0.4;const glow=0.3+0.7*Math.sin(Date.now()/500+f.phase);ctx.save();ctx.globalAlpha=glow*0.8;ctx.shadowColor='#AAFF00';ctx.shadowBlur=8;ctx.fillStyle='#CCFF44';ctx.beginPath();ctx.arc(f.x,f.y,1.5,0,Math.PI*2);ctx.fill();ctx.restore();});
}
function drawBG_Electric(){
  const t=Date.now()/1000;const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#04000E');g.addColorStop(0.5,'#080018');g.addColorStop(1,'#0C0025');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.save();ctx.strokeStyle='rgba(120,0,255,0.06)';ctx.lineWidth=1;for(let x=0;x<W;x+=SEG_W){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}for(let y=0;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}ctx.restore();
  if(Math.random()<0.025){ctx.save();ctx.strokeStyle='rgba(180,80,255,0.5)';ctx.lineWidth=2;ctx.shadowColor='rgba(180,80,255,0.5)';ctx.shadowBlur=10;ctx.beginPath();let lx=Math.random()*W,ly=0;ctx.moveTo(lx,ly);for(let i=0;i<8;i++){lx+=(Math.random()-0.5)*40;ly+=H*0.6/8;ctx.lineTo(lx,ly);}ctx.stroke();ctx.restore();}
  bgData.electric.forEach(o=>{o.x+=Math.sin(t*o.spd+o.phase)*0.8;o.y+=Math.cos(t*o.spd*0.7+o.phase)*0.5;const pulse=0.5+0.5*Math.sin(t*2+o.phase);const rg=ctx.createRadialGradient(o.x,o.y,0,o.x,o.y,o.r*pulse);rg.addColorStop(0,`hsla(${270+o.phase*30},100%,70%,0.3)`);rg.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=rg;ctx.fillRect(o.x-o.r,o.y-o.r,o.r*2,o.r*2);});
  bgData.sparks.forEach(s=>{s.x+=s.vx;s.y+=s.vy;s.life-=0.02;if(s.life<=0){s.x=Math.random()*W;s.y=Math.random()*H;s.vx=(Math.random()-0.5)*3;s.vy=(Math.random()-0.5)*3;s.life=0.5+Math.random()*0.5;}ctx.save();ctx.globalAlpha=s.life*0.8;ctx.shadowColor='#8800FF';ctx.shadowBlur=6;ctx.fillStyle=`hsl(${270+s.life*60},100%,70%)`;ctx.fillRect(s.x,s.y,2,2);ctx.restore();});
}

// ── Secret Backgrounds ────────────────
function drawBG_Mirror(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#000008');g.addColorStop(1,'#080018');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const t=Date.now()/2000;
  for(let i=0;i<8;i++){ctx.save();ctx.globalAlpha=0.04+0.02*Math.sin(t+i);ctx.strokeStyle='#8888FF';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,H*i/8);ctx.lineTo(W,H*(7-i)/8);ctx.stroke();ctx.restore();}
  bgData.space.forEach((s,idx)=>{if(idx%2===0){const tw=0.3+0.5*Math.sin(Date.now()/1200*s.spd+s.phase);ctx.globalAlpha=tw*s.bright*0.5;ctx.fillStyle='#AAAAFF';ctx.fillRect(W-s.x,s.y,s.r,s.r);}});ctx.globalAlpha=1;
  ctx.save();ctx.globalAlpha=0.12+0.05*Math.sin(Date.now()/500);ctx.strokeStyle='#9999FF';ctx.lineWidth=1;ctx.setLineDash([4,4]);ctx.beginPath();ctx.moveTo(W/2,0);ctx.lineTo(W/2,H);ctx.stroke();ctx.setLineDash([]);ctx.restore();
}
function drawBG_Vortex(){
  const t=Date.now()/1000;ctx.fillStyle='#080008';ctx.fillRect(0,0,W,H);
  for(let r=15;r<220;r+=20){const a=t*(180/r);ctx.save();ctx.globalAlpha=0.07;ctx.strokeStyle=`hsl(${(r*3+t*50)%360},100%,60%)`;ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(W/2,H/2,r,a,a+Math.PI*1.6);ctx.stroke();ctx.restore();}
  const rg=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,100);rg.addColorStop(0,'rgba(255,0,255,0.1)');rg.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=rg;ctx.fillRect(0,0,W,H);
}
function drawBG_Chaos(){
  const t=Date.now()/500;
  const h1=(t*30)%360,h2=(t*30+120)%360;
  const g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,`hsla(${h1},80%,5%,1)`);g.addColorStop(1,`hsla(${h2},80%,8%,1)`);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  if(Math.random()<0.04){ctx.save();ctx.globalAlpha=0.05;ctx.fillStyle=`hsl(${Math.random()*360},100%,50%)`;ctx.fillRect(0,0,W,H);ctx.restore();}
  bgData.sparks.forEach(s=>{s.x+=s.vx*1.8;s.y+=s.vy*1.8;s.life-=0.018;if(s.life<=0||s.x<0||s.x>W||s.y<0||s.y>H){s.x=Math.random()*W;s.y=Math.random()*H;s.vx=(Math.random()-0.5)*6;s.vy=(Math.random()-0.5)*6;s.life=0.4+Math.random()*0.6;}ctx.save();ctx.globalAlpha=s.life;ctx.fillStyle=`hsl(${Math.random()*360},100%,70%)`;ctx.fillRect(s.x,s.y,2,2);ctx.restore();});
}

const BG_DRAW=[drawBG_Space,drawBG_Ocean,drawBG_Volcano,drawBG_Forest,drawBG_Electric];

// ══════════════════════════════════
//  THEMES & SECRETS
// ══════════════════════════════════
const THEMES=[
  {name:'SPACE 🌌',  COLORS:['#FF3F5B','#FFCD3C','#3FEFB4','#3F8EFC']},
  {name:'OCEAN 🌊',  COLORS:['#00E5FF','#FF6B9D','#FFE066','#7BFF6B']},
  {name:'VOLCANO 🌋',COLORS:['#FF4500','#FF9500','#FFE600','#FF2277']},
  {name:'FOREST 🌿', COLORS:['#39FF14','#FFD700','#FF69B4','#00CFFF']},
  {name:'ELECTRIC ⚡',COLORS:['#BF00FF','#00FFEA','#FFE600','#FF3FFF']}
];

const SECRETS=[
  {id:'mirror', name:'🪞 MIRROR MODE', desc:'Controls are REVERSED!',    color:'#AAAAFF', req:{stars:1000,stages:75}},
  {id:'vortex', name:'🌀 VORTEX MODE', desc:'Platforms SPIN around you!', color:'#FF44FF', req:{stars:2000,stages:100}},
  {id:'chaos',  name:'🎲 CHAOS MODE',  desc:'NOTHING is predictable!',    color:'#FF6600', req:{stars:5000,stages:150}}
];

const PASSES_PER_STAGE=10;

function getStageProps(n){
  const themeIdx=(n-1)%5,cycle=Math.floor((n-1)/5);
  // ✅ سرعة سلسة ومتصاعدة — كل مرحلة أسرع من السابقة بشكل واضح
  const baseSpeed=2.7+(n-1)*0.35+cycle*0.4;
  const speedStep=0.0005+(n-1)*0.00004;
  const movingChance=Math.min(0.1+(n-1)*0.06,0.85);
  const movingSpeed=0.5+Math.min((n-1)*0.08,1.5);
  return{theme:THEMES[themeIdx],themeIdx,baseSpeed,speedStep,movingChance,movingSpeed,stageNum:n};
}

// ══════════════════════════════════
//  PERSISTENCE
// ══════════════════════════════════
let totalStars=+localStorage.getItem("cd9_stars")||0;
let best      =+localStorage.getItem("cd9_best") ||0;

// ══════════════════════════════════
//  STATE
// ══════════════════════════════════
// state: 'start'|'secrets'|'countdown'|'play'|'over'
let state='start';
let ball,platforms,starItems,particles,floaters;
let speed,passes,sessionStars,stageNum,stagePassCount,stageProps;
let countdown=3,cdInt=null,shakeF=0;

// secret-specific
let activeSecret=null; // null | 'mirror'|'vortex'|'chaos'
let vortexAngle=0;
let chaosTimer=0,chaosBallScale=1;
let mirrorHintFrames=0;

// ══════════════════════════════════
//  AUDIO
// ══════════════════════════════════
let AC=null;
function getAC(){if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();return AC;}
function tone(f,t,d,v,delay){try{const a=getAC(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.type=t;o.frequency.value=f;const st=a.currentTime+(delay||0);g.gain.setValueAtTime(v||0.22,st);g.gain.exponentialRampToValueAtTime(0.001,st+d);o.start(st);o.stop(st+d+0.05);}catch(e){}}
const sfxPass=()=>{tone(440,'sine',0.06,0.2);tone(660,'sine',0.09,0.18,0.07);};
const sfxStar=()=>{tone(880,'sine',0.07,0.22);tone(1200,'sine',0.07,0.18,0.05);};
const sfxLose=()=>{tone(220,'sawtooth',0.12,0.35);tone(140,'sawtooth',0.2,0.3,0.12);};
const sfxCD  =()=>tone(660,'square',0.08,0.15);
const sfxGo  =()=>{[880,1100,1320].forEach((f,i)=>tone(f,'square',0.08,0.18,i*0.06));};
const sfxNext=()=>{[523,659,784,1047,1319].forEach((f,i)=>tone(f,'sine',0.15,0.28,i*0.07));};
const sfxUnlock=()=>{[440,550,660,880,1100].forEach((f,i)=>tone(f,'sine',0.2,0.28,i*0.1));};
const vibe=(p)=>{try{navigator.vibrate&&navigator.vibrate(p);}catch(e){}};

// ══════════════════════════════════
//  PARTICLES
// ══════════════════════════════════
function burst(x,y,color,n,pwr){n=n||12;pwr=pwr||4;for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=pwr*0.4+Math.random()*pwr;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-pwr*0.3,color,r:2+Math.random()*3.5,life:1,sq:Math.random()<0.4,rot:Math.random()*6.28});}}
function floatText(x,y,txt,color){floaters.push({x,y,txt,color,life:1,vy:-1.4});}

// ══════════════════════════════════
//  PLATFORM
// ══════════════════════════════════
function shuffle(){const a=[0,1,2,3];for(let i=3;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function mkPlat(y,forceColor){
  const order=shuffle();
  if(forceColor!==undefined){
    const slot=Math.floor(Math.random()*4);
    const idx=order.indexOf(forceColor);
    if(idx!==slot)[order[slot],order[idx]]=[order[idx],order[slot]];
  }
  const sp=stageProps||{movingChance:0.5,movingSpeed:1.2};
  const moving=Math.random()<(activeSecret?0.9:sp.movingChance);
  const maxOffset=Math.floor(25+Math.random()*45);
  const base={y,order,passed:false,moving,
    offsetX:0,moveDir:Math.random()<0.5?1:-1,
    moveSpd:(activeSecret?1.4:sp.movingSpeed)*(0.7+Math.random()*0.6),
    maxOffset,alpha:0};
  if(activeSecret==='vortex'){base.rotAngle=Math.random()*Math.PI*2;base.rotSpeed=(Math.random()-0.5)*0.03;}
  return base;
}

function trySpawnStar(y){
  const roll=Math.random();
  if(roll<0.08){
    // ✅ صف من 4 نجوم — يظهر أحياناً لتشجيع التحرك السريع
    spawnStarRow(y-70);
  } else if(roll<0.08+0.35){
    // نجمة عادية
    starItems.push({x:30+Math.random()*(W-60),y:y-80,collected:false,pulse:Math.random()*6.28,bonus:false});
  }
}

function spawnStarRow(y){
  // 4 نجوم على صف واحد موزعة بالتساوي مع فراغ بسيط بينها
  const spacing=W/5;
  const startX=spacing*0.6;
  for(let i=0;i<4;i++){
    starItems.push({
      x:startX+i*spacing,
      y:y,
      collected:false,
      pulse:i*0.5,
      bonus:true,   // نجوم مميزة — أكبر وألمع
      rowId:Date.now() // لربطها ببعض
    });
  }
  // نص تشجيعي
  floatText(W/2,y-20,'GRAB THEM ALL! ⭐⭐⭐⭐','#FFCD3C');
}

// ══════════════════════════════════
//  INIT
// ══════════════════════════════════
function init(secret){
  activeSecret=secret||null;
  vortexAngle=0;chaosTimer=0;chaosBallScale=1;mirrorHintFrames=secret==='mirror'?180:0;
  const ci=Math.floor(Math.random()*4);
  ball={x:W/2,y:H*0.27,r:14,color:ci,trail:[],pulse:0,squish:0};
  platforms=[];starItems=[];particles=[];floaters=[];
  passes=0;sessionStars=0;stageNum=1;stagePassCount=0;
  stageProps=getStageProps(1);
  speed=activeSecret?3.0:stageProps.baseSpeed;
}
function initPlatforms(){
  platforms=[];
  for(let i=0;i<6;i++){const y=H*0.52+i*145;platforms.push(mkPlat(y,i===0?ball.color:undefined));trySpawnStar(y);}
}

// ══════════════════════════════════
//  INPUT
// ══════════════════════════════════
canvas.addEventListener("mousemove",e=>{
  if(state!=="play")return;
  const r=canvas.getBoundingClientRect();
  let nx=(e.clientX-r.left)*(W/r.width);
  // MIRROR: flip input
  if(activeSecret==='mirror') nx=W-nx;
  ball.x=Math.max(ball.r,Math.min(W-ball.r,nx));
});
canvas.addEventListener("touchmove",e=>{
  if(state!=="play")return;e.preventDefault();
  const r=canvas.getBoundingClientRect();
  let nx=(e.touches[0].clientX-r.left)*(W/r.width);
  if(activeSecret==='mirror') nx=W-nx;
  ball.x=Math.max(ball.r,Math.min(W-ball.r,nx));
},{passive:false});

canvas.addEventListener("click",handleTap);
canvas.addEventListener("touchstart",e=>{e.preventDefault();handleTap(e);},{passive:false});

function handleTap(e){
  const r=canvas.getBoundingClientRect();
  const tx=((e.clientX||(e.touches&&e.touches[0].clientX)||0)-r.left)*(W/r.width);
  const ty=((e.clientY||(e.touches&&e.touches[0].clientY)||0)-r.top)*(H/r.height);

  if(state==='over'){
    // ✅ زر إعادة المحاولة فقط — منطقة محددة
    const btnY=H*0.80, btnH=40;
    if(ty>=btnY-btnH/2&&ty<=btnY+btnH/2){
      startGame(activeSecret);return;
    }
    // أزرار المراحل السرية
    for(let i=0;i<SECRETS.length;i++){
      const sm=SECRETS[i];
      const bx=W/2-110+i*74,by=H*0.68,bw=68,bh=34;
      if(tx>=bx&&tx<=bx+bw&&ty>=by&&ty<=by+bh){
        if(isUnlocked(sm)){startGame(sm.id);return;}
        else{floatText(W/2,H*0.62,'🔒 NOT UNLOCKED YET','#FF4444');return;}
      }
    }
    return;
  }

  if(state==='start'){
    for(let i=0;i<SECRETS.length;i++){
      const sm=SECRETS[i];
      const bx=W/2-110+i*74,by=H*0.745,bw=68,bh=34;
      if(tx>=bx&&tx<=bx+bw&&ty>=by&&ty<=by+bh){
        if(isUnlocked(sm)){startGame(sm.id);return;}
        else{floatText(W/2,H*0.72,'🔒 NOT UNLOCKED YET','#FF4444');return;}
      }
    }
    startGame(null);
  }
}

function isUnlocked(sm){return totalStars>=sm.req.stars&&best>=sm.req.stages;}

function startGame(secret){
  init(secret);initPlatforms();
  countdown=3;state='countdown';sfxCD();
  if(cdInt)clearInterval(cdInt);
  cdInt=setInterval(()=>{countdown--;if(countdown>0)sfxCD();if(countdown<=0){clearInterval(cdInt);cdInt=null;sfxGo();state='play';}},1000);
}

// ══════════════════════════════════
//  UPDATE
// ══════════════════════════════════
function getColors(){
  if(activeSecret==='mirror') return['#AAAAFF','#FFAAFF','#AAFFFF','#FFFFFF'];
  if(activeSecret==='vortex') return['#FF44FF','#44FFFF','#FFFF44','#FF88FF'];
  if(activeSecret==='chaos')  return Array.from({length:4},(_,i)=>`hsl(${(chaosTimer*3+i*90)%360},100%,65%)`);
  return stageProps.theme.COLORS;
}

function update(){
  if(state!=='play')return;
  if(shakeF>0)shakeF--;
  if(mirrorHintFrames>0)mirrorHintFrames--;
  chaosTimer++;

  // CHAOS: every 80 frames shuffle colors + random speed
  if(activeSecret==='chaos'&&chaosTimer%80===0){
    for(const p of platforms){if(!p.passed)p.order=shuffle();}
    if(Math.random()<0.35) ball.color=Math.floor(Math.random()*4);
    speed=2.0+Math.random()*3.5;
    chaosBallScale=0.6+Math.random()*0.9;
    floatText(W/2,H*0.42,'CHAOS! 🎲','#FF6600');
    vibe(30);
  }
  chaosBallScale+=(1-chaosBallScale)*0.06;

  if(!activeSecret) speed+=stageProps.speedStep;
  else speed+=0.0009;

  vortexAngle+=0.006;

  for(const p of platforms){
    p.y-=speed;
    if(p.alpha<1)p.alpha=Math.min(1,p.alpha+0.05);
    if(p.moving){
      p.offsetX+=p.moveDir*p.moveSpd;
      if(p.offsetX>=p.maxOffset){p.offsetX=p.maxOffset;p.moveDir=-1;}
      else if(p.offsetX<=-p.maxOffset){p.offsetX=-p.maxOffset;p.moveDir=1;}
    }
    if(activeSecret==='vortex'&&p.rotAngle!==undefined) p.rotAngle+=p.rotSpeed;
  }

  for(let i=starItems.length-1;i>=0;i--){const s=starItems[i];if(!s.collected){s.y-=speed;s.pulse+=0.1;if(s.y+15<0)starItems.splice(i,1);}}
  while(platforms.length&&platforms[0].y+20<-10)platforms.shift();
  while(platforms.length<7){const last=platforms[platforms.length-1];const ny=last.y+128+Math.random()*28;platforms.push(mkPlat(ny));trySpawnStar(ny);}

  const cols=getColors();
  ball.trail.push({x:ball.x,y:ball.y,c:cols[ball.color]});
  if(ball.trail.length>12)ball.trail.shift();
  ball.pulse+=0.09;if(ball.squish>0)ball.squish=Math.max(0,ball.squish-0.07);

  for(let i=starItems.length-1;i>=0;i--){
    const s=starItems[i];if(s.collected)continue;
    const dx=ball.x-s.x,dy=ball.y-s.y;
    if(dx*dx+dy*dy<(ball.r+14)*(ball.r+14)){
      s.collected=true;sessionStars++;totalStars++;
      localStorage.setItem("cd9_stars",totalStars);
      sfxStar();vibe(15);
      burst(s.x,s.y,s.bonus?'#FFE566':'#FFCD3C',s.bonus?18:12,s.bonus?5:3);
      floatText(s.x,s.y-10,s.bonus?'+⭐ BONUS!':'+⭐','#FFCD3C');

      // تحقق لو اكتمل الصف كاملاً
      if(s.bonus&&s.rowId){
        const sameRow=starItems.filter(r=>r.rowId===s.rowId);
        const allCollected=sameRow.every(r=>r.collected);
        if(allCollected){
          // مكافأة إضافية — 3 نجوم مجانية!
          sessionStars+=3;totalStars+=3;
          localStorage.setItem("cd9_stars",totalStars);
          burst(ball.x,ball.y,'#FFE566',25,6);
          floatText(W/2,H*0.4,'ROW COMPLETE! +3 BONUS ⭐','#FFE566');
          [880,1100,1320,1560].forEach((f,i)=>tone(f,'sine',0.12,0.25,i*0.07));
          vibe([20,10,20,10,40]);
        }
      }
    }
  }

  for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.13;p.vx*=0.97;p.rot+=0.1;p.life-=0.025;if(p.life<=0)particles.splice(i,1);}
  for(let i=floaters.length-1;i>=0;i--){const f=floaters[i];f.y+=f.vy;f.life-=0.022;if(f.life<=0)floaters.splice(i,1);}

  // COLLISION
  for(const p of platforms){
    if(ball.y+ball.r<p.y||ball.y-ball.r>p.y+20)continue;
    let checkX=ball.x;
    // MIRROR: flip collision X
    if(activeSecret==='mirror') checkX=W-ball.x;
    // VORTEX: un-rotate the check point
    if(activeSecret==='vortex'&&p.rotAngle!==undefined){
      const cx=W/2,cy=p.y+10;
      const dx=checkX-cx,dy=ball.y-cy;
      const cos=Math.cos(-p.rotAngle),sin=Math.sin(-p.rotAngle);
      checkX=cx+dx*cos-dy*sin;
    }
    const bx=checkX-(p.moving?p.offsetX:0);
    if(bx<0||bx>W)continue;
    const col=Math.floor(bx/SEG_W);
    if(col<0||col>3)continue;

    if(p.order[col]===ball.color){
      if(!p.passed){
        p.passed=true;passes++;
        if(!activeSecret){stagePassCount++;if(passes>best){best=passes;localStorage.setItem("cd9_best",best);}}
        else{if(passes>best){best=passes;localStorage.setItem("cd9_best",best);}}
        let nc;do{nc=Math.floor(Math.random()*4);}while(nc===ball.color);
        burst(ball.x,ball.y,getColors()[ball.color],14,3);
        ball.color=nc;ball.squish=1;sfxPass();vibe(18);floatText(ball.x,ball.y-30,'+1','#fff');
        if(!activeSecret&&stagePassCount>=PASSES_PER_STAGE){
          stageNum++;stagePassCount=0;stageProps=getStageProps(stageNum);
          // ✅ لا نرجع للصفر — نأخذ أعلى قيمة بين السرعة الحالية والجديدة
          speed=Math.max(speed, stageProps.baseSpeed);
          initPlatforms();sfxNext();vibe([30,20,60,20,30]);
          floatText(W/2,H/2-30,'STAGE '+stageNum+' • '+stageProps.theme.name,'#FFCD3C');
        }
      }
    } else {
      if(!p.passed){
        state='over';shakeF=20;
        burst(ball.x,ball.y,getColors()[ball.color],28,6);
        burst(ball.x,ball.y,'#fff',10,3);
        sfxLose();vibe([80,40,80,40,120]);
        if(passes>best){best=passes;localStorage.setItem("cd9_best",best);}
      }
    }
  }
}

// ══════════════════════════════════
//  DRAW HELPERS
// ══════════════════════════════════
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();}
function drawStar5(x,y,r2,color){ctx.save();ctx.shadowColor=color;ctx.shadowBlur=14;ctx.fillStyle=color;ctx.beginPath();for(let i=0;i<10;i++){const a=i*Math.PI/5-Math.PI/2,rad=i%2===0?r2:r2*0.42;i===0?ctx.moveTo(x+Math.cos(a)*rad,y+Math.sin(a)*rad):ctx.lineTo(x+Math.cos(a)*rad,y+Math.sin(a)*rad);}ctx.closePath();ctx.fill();ctx.restore();}

function drawPlatforms(){
  const cols=getColors();
  for(const p of platforms){
    ctx.save();ctx.globalAlpha=p.alpha;
    const ox=p.moving?p.offsetX:0;
    // VORTEX: rotate whole platform
    if(activeSecret==='vortex'&&p.rotAngle!==undefined){ctx.save();ctx.translate(W/2,p.y+10);ctx.rotate(p.rotAngle);ctx.translate(-W/2,-p.y-10);}
    for(let i=0;i<4;i++){
      const sc=p.order[i],isGap=(sc===ball.color);
      let x=i*SEG_W+ox;
      if(activeSecret==='mirror') x=W-(i+1)*SEG_W+ox;
      const c=cols[sc];
      if(isGap){
        const pulse=0.15+0.1*Math.sin(Date.now()/200);
        ctx.save();ctx.fillStyle=c;ctx.globalAlpha=pulse;rr(x+2,p.y,SEG_W-4,20,5);ctx.fill();
        ctx.globalAlpha=0.7+0.3*Math.sin(Date.now()/200);ctx.strokeStyle=c;ctx.lineWidth=2.5;ctx.shadowColor=c;ctx.shadowBlur=12;rr(x+2,p.y,SEG_W-4,20,5);ctx.stroke();
        ctx.restore();continue;
      }
      ctx.save();ctx.shadowColor=c;ctx.shadowBlur=10;ctx.fillStyle=c;rr(x+2,p.y,SEG_W-4,20,5);ctx.fill();
      ctx.fillStyle='rgba(255,255,255,0.17)';rr(x+4,p.y+2,SEG_W-8,6,3);ctx.fill();ctx.restore();
    }
    if(activeSecret==='vortex'&&p.rotAngle!==undefined) ctx.restore();
    ctx.restore();
  }
}

function drawBall(){
  const b=ball,cols=getColors(),bc=cols[b.color];
  const drawX=activeSecret==='mirror'?W-b.x:b.x;
  for(let i=0;i<b.trail.length;i++){const t=b.trail[i];ctx.beginPath();ctx.arc(t.x,t.y,b.r*(i/b.trail.length)*0.65,0,Math.PI*2);ctx.fillStyle=t.c;ctx.globalAlpha=(i/b.trail.length)*0.2;ctx.fill();}
  ctx.globalAlpha=1;ctx.save();ctx.translate(drawX,b.y);
  const sc=activeSecret==='chaos'?chaosBallScale:1;
  ctx.scale((1+b.squish*0.18)*sc,(1-b.squish*0.35)*sc);
  if(activeSecret==='mirror')ctx.scale(-1,1);
  ctx.shadowColor=bc;ctx.shadowBlur=22+Math.sin(b.pulse)*4;
  ctx.beginPath();ctx.arc(0,0,b.r,0,Math.PI*2);ctx.fillStyle=bc;ctx.fill();
  const sg=ctx.createRadialGradient(-4,-4,1,-4,-4,b.r*0.85);sg.addColorStop(0,'rgba(255,255,255,0.5)');sg.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=sg;ctx.beginPath();ctx.arc(0,0,b.r,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

function drawStars(){
  // رسم خط رابط بين نجوم الصف أولاً
  const rows={};
  for(const s of starItems){
    if(s.bonus&&!s.collected&&s.rowId){
      if(!rows[s.rowId])rows[s.rowId]=[];
      rows[s.rowId].push(s);
    }
  }
  for(const rowId in rows){
    const row=rows[rowId];
    if(row.length<2)continue;
    row.sort((a,b)=>a.x-b.x);
    ctx.save();
    ctx.strokeStyle='rgba(255,205,60,0.3)';
    ctx.lineWidth=1;ctx.setLineDash([4,4]);
    ctx.beginPath();ctx.moveTo(row[0].x,row[0].y);
    for(let i=1;i<row.length;i++)ctx.lineTo(row[i].x,row[i].y);
    ctx.stroke();ctx.setLineDash([]);ctx.restore();
  }

  for(const s of starItems){
    if(s.collected)continue;
    const sc=0.88+Math.sin(s.pulse)*0.14;
    ctx.save();ctx.translate(s.x,s.y);ctx.scale(sc,sc);
    if(s.bonus){
      // نجوم الصف — أكبر وتومض بقوة
      const glow=0.8+0.2*Math.sin(Date.now()/150+s.pulse);
      ctx.save();ctx.globalAlpha=glow;
      drawStar5(0,0,15,'#FFCD3C');
      // هالة خارجية
      ctx.globalAlpha=0.2*glow;
      ctx.shadowColor='#FFCD3C';ctx.shadowBlur=20;
      ctx.beginPath();ctx.arc(0,0,18,0,Math.PI*2);
      ctx.fillStyle='#FFCD3C';ctx.fill();
      ctx.restore();
    } else {
      drawStar5(0,0,11,'#FFCD3C');
    }
    ctx.restore();
  }
}
function drawParticles(){for(const p of particles){ctx.save();ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.color;if(p.sq){ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillRect(-p.r,-p.r,p.r*2,p.r*2);}else{ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();}ctx.restore();}}
function drawFloaters(){for(const f of floaters){ctx.save();ctx.globalAlpha=Math.max(0,f.life*1.8);ctx.fillStyle=f.color;ctx.shadowColor=f.color;ctx.shadowBlur=8;ctx.font='bold 16px sans-serif';ctx.textAlign='center';ctx.fillText(f.txt,f.x,f.y);ctx.restore();}}

function drawHUD(){
  const cols=getColors();
  const sm=activeSecret?SECRETS.find(s=>s.id===activeSecret):null;
  ctx.save();ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.textAlign='center';ctx.shadowColor='rgba(0,0,0,0.9)';ctx.shadowBlur=12;ctx.fillText(passes,W/2,50);ctx.restore();
  // stage / mode name
  const label=sm?sm.name:'STAGE '+stageNum+' • '+stageProps.theme.name;
  const lcolor=sm?sm.color:'#fff';
  ctx.save();ctx.fillStyle='rgba(0,0,0,0.5)';rr(W/2-70,56,140,22,11);ctx.fill();
  ctx.fillStyle=lcolor;ctx.font='bold 11px sans-serif';ctx.textAlign='center';ctx.shadowColor=lcolor;ctx.shadowBlur=6;ctx.fillText(label,W/2,71);ctx.restore();
  // progress bar (only normal mode)
  if(!activeSecret){
    const prog=Math.min(stagePassCount/PASSES_PER_STAGE,1);
    const barX=W/2-55,barW=110,barH=7,barY=80;
    ctx.save();ctx.fillStyle='rgba(0,0,0,0.4)';rr(barX,barY,barW,barH,3);ctx.fill();
    cols.forEach((c,i)=>{ctx.save();ctx.fillStyle=c;ctx.globalAlpha=0.3;rr(barX+i*(barW/4)+(i>0?1:0),barY,(barW/4)-(i<3?1:0),barH,i===0?3:i===3?3:0);ctx.fill();ctx.restore();});
    if(prog>0){ctx.save();ctx.fillStyle=cols[ball.color];ctx.shadowColor=cols[ball.color];ctx.shadowBlur=6;rr(barX,barY,barW*prog,barH,3);ctx.fill();ctx.restore();}
    ctx.beginPath();ctx.arc(barX+barW*prog,barY+barH/2,5,0,Math.PI*2);ctx.fillStyle=cols[ball.color];ctx.shadowColor=cols[ball.color];ctx.shadowBlur=10;ctx.fill();
    ctx.restore();
  }
  // stars
  ctx.save();ctx.fillStyle='rgba(0,0,0,0.5)';rr(W-90,10,80,28,14);ctx.fill();ctx.fillStyle='#FFCD3C';ctx.font='bold 13px sans-serif';ctx.textAlign='center';ctx.shadowColor='rgba(0,0,0,0.8)';ctx.shadowBlur=4;ctx.fillText('⭐ '+sessionStars,W-50,29);ctx.restore();
  // mirror hint
  if(activeSecret==='mirror'&&mirrorHintFrames>0){
    ctx.save();ctx.globalAlpha=Math.min(1,mirrorHintFrames/60);ctx.fillStyle='#AAAAFF';ctx.font='bold 13px sans-serif';ctx.textAlign='center';ctx.shadowColor='#AAAAFF';ctx.shadowBlur=8;ctx.fillText('⚠️ CONTROLS ARE REVERSED!',W/2,H-28);ctx.restore();
  }
}

// ══════════════════════════════════
//  SECRET BUTTONS (on start/over)
// ══════════════════════════════════
function drawSecretButtons(yBase){
  SECRETS.forEach((sm,i)=>{
    const bx=W/2-110+i*74,by=yBase,bw=68,bh=34;
    const unlocked=isUnlocked(sm);
    const partial=totalStars>=sm.req.stars||best>=sm.req.stages;
    ctx.save();
    ctx.fillStyle=unlocked?'rgba(0,0,0,0.6)':'rgba(0,0,0,0.5)';
    ctx.strokeStyle=unlocked?sm.color:'rgba(255,255,255,0.15)';
    ctx.lineWidth=unlocked?1.5:1;
    rr(bx,by,bw,bh,8);ctx.fill();ctx.stroke();
    if(unlocked){ctx.shadowColor=sm.color;ctx.shadowBlur=10;}
    ctx.fillStyle=unlocked?sm.color:partial?'rgba(255,255,255,0.3)':'rgba(255,255,255,0.15)';
    ctx.font=`bold ${unlocked?10:9}px sans-serif`;ctx.textAlign='center';
    ctx.fillText(unlocked?sm.name.split(' ')[0]+sm.name.split(' ')[1]:'🔒',bx+bw/2,by+14);
    ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='8px sans-serif';
    if(unlocked) ctx.fillText('UNLOCKED ✓',bx+bw/2,by+26);
    else ctx.fillText(`⭐${sm.req.stars} • S${sm.req.stages}`,bx+bw/2,by+26);
    ctx.restore();
  });
  ctx.save();ctx.fillStyle='rgba(255,255,255,0.2)';ctx.font='10px sans-serif';ctx.textAlign='center';ctx.fillText('SECRET MODES',W/2,yBase-8);ctx.restore();
}

function drawStart(){
  drawBG_Space();ctx.fillStyle='rgba(0,0,5,0.4)';ctx.fillRect(0,0,W,H);
  const t=Date.now()/1000;
  THEMES[0].COLORS.forEach((c,i)=>{const a=t+i*Math.PI/2;ctx.save();ctx.shadowColor=c;ctx.shadowBlur=20;ctx.beginPath();ctx.arc(W/2+Math.cos(a)*52,H*0.28+Math.sin(a)*18,11,0,Math.PI*2);ctx.fillStyle=c;ctx.fill();ctx.restore();});
  ctx.save();ctx.textAlign='center';ctx.font='bold 54px sans-serif';
  const tg=ctx.createLinearGradient(W/2-100,0,W/2+100,0);tg.addColorStop(0,'#FF3F5B');tg.addColorStop(0.5,'#FFCD3C');tg.addColorStop(1,'#3F8EFC');
  ctx.fillStyle=tg;ctx.shadowColor='rgba(0,0,0,0.8)';ctx.shadowBlur=12;
  ctx.fillText('COLOR',W/2,H*0.42);ctx.fillText('DROP',W/2,H*0.42+58);ctx.restore();
  ctx.save();ctx.textAlign='center';THEMES.forEach((s,i)=>{const x=W/2+(i-2)*36;ctx.save();ctx.shadowColor=s.COLORS[0];ctx.shadowBlur=10;ctx.beginPath();ctx.arc(x,H*0.60,7,0,Math.PI*2);ctx.fillStyle=s.COLORS[0];ctx.fill();ctx.restore();});ctx.fillStyle='rgba(255,255,255,0.3)';ctx.font='11px sans-serif';ctx.fillText('∞ INFINITE STAGES',W/2,H*0.655);ctx.restore();
  if(best>0){ctx.save();ctx.fillStyle='#FFCD3C';ctx.font='bold 13px sans-serif';ctx.textAlign='center';ctx.shadowColor='rgba(0,0,0,0.8)';ctx.shadowBlur=6;ctx.fillText('🏆 BEST: '+best+'   ⭐ '+totalStars,W/2,H*0.70);ctx.restore();}
  // secret buttons
  drawSecretButtons(H*0.745);
  ctx.save();ctx.globalAlpha=0.5+0.5*Math.sin(t*3);ctx.fillStyle='#fff';ctx.font='bold 16px sans-serif';ctx.textAlign='center';ctx.shadowColor='rgba(0,0,0,0.8)';ctx.shadowBlur=8;ctx.fillText('TAP TO PLAY',W/2,H*0.915);ctx.restore();
}

function drawCountdown(){
  if(activeSecret==='mirror') drawBG_Mirror();
  else if(activeSecret==='vortex') drawBG_Vortex();
  else if(activeSecret==='chaos') drawBG_Chaos();
  else BG_DRAW[stageProps.themeIdx]();
  drawPlatforms();drawBall();
  ctx.fillStyle='rgba(0,0,0,0.45)';ctx.fillRect(0,0,W,H);
  const cols=activeSecret?getColors():stageProps.theme.COLORS;
  cols.forEach((c,i)=>{const x=W/2+(i-1.5)*32;ctx.save();ctx.shadowColor=c;ctx.shadowBlur=16;ctx.beginPath();ctx.arc(x,H/2-65,10,0,Math.PI*2);ctx.fillStyle=c;ctx.fill();ctx.restore();});
  const num=countdown>0?countdown:'GO!',col=countdown>0?'#FF3F5B':'#3FEFB4',sc=1+0.07*Math.sin(Date.now()/70);
  ctx.save();ctx.translate(W/2,H/2);ctx.scale(sc,sc);ctx.font='bold 90px sans-serif';ctx.textAlign='center';ctx.shadowColor=col;ctx.shadowBlur=40;ctx.fillStyle=col;ctx.fillText(num,0,30);ctx.restore();
  if(activeSecret){const sm=SECRETS.find(s=>s.id===activeSecret);ctx.save();ctx.fillStyle=sm.color;ctx.font='bold 13px sans-serif';ctx.textAlign='center';ctx.shadowColor=sm.color;ctx.shadowBlur=10;ctx.fillText(sm.desc,W/2,H/2+70);ctx.restore();}
}

function drawOver(){
  if(activeSecret==='mirror') drawBG_Mirror();
  else if(activeSecret==='vortex') drawBG_Vortex();
  else if(activeSecret==='chaos') drawBG_Chaos();
  else BG_DRAW[stageProps.themeIdx]();
  drawParticles();
  ctx.fillStyle='rgba(0,0,0,0.80)';ctx.fillRect(0,0,W,H);
  const sm=activeSecret?SECRETS.find(s=>s.id===activeSecret):null;
  const borderCol=sm?sm.color:'rgba(255,255,255,0.1)';
  ctx.save();ctx.fillStyle='rgba(255,255,255,0.04)';ctx.strokeStyle=borderCol;ctx.lineWidth=1.5;rr(28,H*0.10,W-56,H*0.72,22);ctx.fill();ctx.stroke();ctx.restore();
  ctx.textAlign='center';
  if(sm){ctx.save();ctx.font='bold 14px sans-serif';ctx.fillStyle=sm.color;ctx.shadowColor=sm.color;ctx.shadowBlur=14;ctx.fillText(sm.name,W/2,H*0.17);ctx.restore();}
  ctx.save();ctx.font='bold 26px sans-serif';ctx.fillStyle='#FF3F5B';ctx.shadowColor='#FF3F5B';ctx.shadowBlur=18;ctx.fillText('GAME OVER',W/2,H*0.23);ctx.restore();
  ctx.save();ctx.font='bold 70px sans-serif';ctx.fillStyle='#fff';ctx.shadowColor='rgba(255,255,255,0.25)';ctx.shadowBlur=14;ctx.fillText(passes,W/2,H*0.36);ctx.restore();
  ctx.save();ctx.font='13px sans-serif';ctx.fillStyle='rgba(255,255,255,0.38)';ctx.fillText('PASSES',W/2,H*0.40);ctx.restore();
  ctx.save();ctx.strokeStyle='rgba(255,255,255,0.08)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(55,H*0.43);ctx.lineTo(W-55,H*0.43);ctx.stroke();ctx.restore();
  [[W/4,'🏆 BEST',best],[W*3/4,'⭐ STARS',sessionStars]].forEach(([x,l,v])=>{ctx.save();ctx.fillStyle='rgba(255,255,255,0.45)';ctx.font='11px sans-serif';ctx.textAlign='center';ctx.fillText(l,x,H*0.48);ctx.fillStyle='#fff';ctx.font='bold 22px sans-serif';ctx.fillText(v,x,H*0.53);ctx.restore();});
  if(!sm){const col=stageProps.theme.COLORS[0];ctx.save();ctx.fillStyle=col;ctx.font='bold 13px sans-serif';ctx.textAlign='center';ctx.shadowColor=col;ctx.shadowBlur=10;ctx.fillText('REACHED: STAGE '+stageNum+' • '+stageProps.theme.name,W/2,H*0.585);ctx.restore();}
  ctx.save();ctx.fillStyle='rgba(255,205,60,0.7)';ctx.font='13px sans-serif';ctx.textAlign='center';ctx.fillText('TOTAL STARS: '+totalStars,W/2,H*0.63);ctx.restore();
  // secret buttons
  drawSecretButtons(H*0.68);
  ctx.save();ctx.globalAlpha=0.5+0.5*Math.sin(Date.now()/380);ctx.fillStyle='#fff';ctx.font='bold 15px sans-serif';ctx.textAlign='center';ctx.fillText('TAP TO PLAY AGAIN',W/2,H*0.80);ctx.restore();
}

// ══════════════════════════════════
//  MAIN LOOP
// ══════════════════════════════════
function loop(){
  ctx.save();
  if(shakeF>0&&state==='play'){const s=2.5*(shakeF/20);ctx.translate((Math.random()-0.5)*s,(Math.random()-0.5)*s);}
  if(state==='start')         drawStart();
  else if(state==='countdown'){update();drawCountdown();}
  else if(state==='play'){
    update();
    if(activeSecret==='mirror') drawBG_Mirror();
    else if(activeSecret==='vortex') drawBG_Vortex();
    else if(activeSecret==='chaos') drawBG_Chaos();
    else BG_DRAW[stageProps.themeIdx]();
    drawPlatforms();drawStars();drawParticles();drawBall();drawFloaters();drawHUD();
  }
  else if(state==='over'){update();drawOver();}
  ctx.restore();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
